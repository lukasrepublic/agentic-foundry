# btb-gates.yml — the native merge floor's conditional gates (introduced in v0.24.0).
# NOTE for adopters copying this template: the "merge floor tier" summary line below is a
# hardcoded label — set this label to match your plan (A where rulesets enforce, B otherwise).
#
# THREE ALWAYS-REPORTING gate jobs (a required context that never reports blocks a PR forever —
# each job always concludes, reporting `not applicable` when its condition doesn't bind):
#   * spec-link          — floor #1 as CI: a factory-lane PR must name its authorizing spec
#                          (`Spec:` trailer in the PR body); light-lane and docs-only PRs are
#                          not-applicable. Replaces the provenance-marker chain as the lane signal.
#   * security-path      — floor #3 routing as CI: a diff touching auth/secrets/supply-chain paths
#                          requires the `security-reviewed` label (posted after a security-reviewer
#                          subagent pass); clean diffs are not-applicable.
#   * shell-parse-bash32 — bash32-parse-guard (feat-foundry-bash32-parse-guard, AC-B32-4..8,10,12):
#                          runs `bash -n` under a digest-pinned, version-asserted bash 3.2
#                          container over every git-tracked `*.sh`, DISCOVERED (never enumerated),
#                          so a file that parses under the runner's modern bash but not under the
#                          bash 3.2 macOS still ships as `/bin/bash` cannot ship unnoticed. Always
#                          runs (no `if:`), fails closed on any parse failure. Tier B, advisory,
#                          same as its two siblings.
#
# MERGE-FLOOR TIER: no longer stated here as a literal. Each job DERIVES it from the live branch
# protection state (see the `tier()` helper). The old hardcoded "TIER B: ADVISORY — private repo,
# Free plan" line was accurate when written and silently became false on 2026-08-04 when the repo
# went public with enforcing branch protection — a public, wrong claim about our own merge floor,
# which is exactly the class of drift this project exists to catch.
# TIER-A PRECONDITIONS (recorded per the 2026-07-27 floor-#3 review, findings 5/8) — ALL MET as of
# 2026-08-04, and they had to be, because going public made two of them live fork surface:
#   * branch protection + required checks — applied at the flip (6 required contexts, enforce_admins,
#     no force-push, no deletion);
#   * CODEOWNERS on .github/ — added (see .github/CODEOWNERS, which is explicit about being
#     advisory until `require_code_owner_review` is enabled);
#   * label-only lane signals — spec-link no longer reads `Lane: light` from the fork-controlled
#     PR body;
#   * stale-label TOCTOU — security-path now fails when commits land after the review label.
# E2E-journeys gate: not present for this repo (no app runtime); the adopter template ships
# with the Phase-5 certification path.
#
# Checkout: `spec-link` and `security-path` remain pure-API (gh) — no repo code is fetched or
# executed there (floor-#3 review finding 6: no token-in-.git/config, no fetch-and-execute).
# `shell-parse-bash32` DOES check out the repo (feat-foundry-bash32-parse-guard, AC-B32-12) — a
# parse gate over the repository's own shipped scripts cannot avoid it. The reversal is bounded:
# `persist-credentials: false`, a job-level `permissions: contents: read` (no `pull-requests:
# read`), the unchanged `pull_request` trigger (never `pull_request_target`, so fork code never
# runs with a privileged token), and a read-only bind mount into the bash-3.2 container with
# `-n` — the scripts are PARSED, never executed. The next floor-#3 review should re-examine
# finding 6 against this job specifically.
name: btb-gates
on:
  pull_request:
    # `edited` was added here and REMOVED again in the same review cycle. It re-runs the gates at
    # the SAME head SHA with action=edited, which let a PR author supersede a red staleness verdict
    # by editing the description — one click, no commits, no re-review (security review Block 1,
    # 2026-08-04). Convenience is not worth a bypass; re-run the check instead.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  spec-link:
    runs-on: ubuntu-24.04
    steps:
      - name: spec-link gate (always reports)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          body="$(gh pr view "$PR" --repo "$REPO" --json body -q .body)"
          labels="$(gh pr view "$PR" --repo "$REPO" --json labels -q '.labels[].name')"
          files="$(gh api --paginate "repos/${REPO}/pulls/${PR}/files" -q '.[].filename')"
          summary() { printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"; printf '%s\n' "$1"; }
          # DERIVED, never hardcoded. This line was a literal "tier: B (advisory) — private repo,
          # Free plan" for as long as that happened to be true; it silently became false the moment
          # the repo went public with branch protection, and it is a PUBLIC claim about our own
          # merge floor. Reading it from the API costs one call and removes the drift class.
          # Duplicated verbatim in security-path rather than factored into a script because these
          # two jobs are deliberately CHECKOUT-FREE (floor-#3 review finding 6: no repo code is
          # fetched or executed here) — a shared script would mean checking out to run it.
          tier() {
            local p; p="$(gh api "repos/${REPO}/branches/${BASE}" -q .protected 2>/dev/null || echo unknown)"
            # `.protected` is a COARSE boolean — it is true for a branch protected only by
            # "restrict deletions". It proves SOMETHING guards the branch, never that THESE contexts
            # are required, and a read-only token cannot enumerate that (the /protection endpoint is
            # admin-only). So this reports what it can actually substantiate and no more (security
            # review Block 3, 2026-08-04) — the same discipline foundry_tier_preflight.py applies
            # when it refuses to call classic protection Tier A.
            case "$p" in
              true)  printf '**merge floor: `%s` IS server-protected** — some protection is active; this job cannot enumerate WHICH contexts are required with a read-only token' "$BASE" ;;
              false) printf '**merge floor tier: B (advisory)** — `%s` is NOT server-protected; these checks report, the server does not enforce' "$BASE" ;;
              *)     printf '**merge floor: UNKNOWN** — could not read protection state for `%s`; treat as advisory' "$BASE" ;;
            esac
          }
          summary "$(tier)"
          if printf '%s\n' "$body" | grep -qE '^Spec: .+'; then
            spec_ref="$(printf '%s\n' "$body" | grep -E '^Spec: ' | sed -n '1p' | tr -cd '[:alnum:]/._ :-' | cut -c1-200)"
            summary "spec-link: PASS — factory lane, ${spec_ref}"
          elif printf '%s\n' "$labels" | grep -qxF 'lane:light'; then
            # LABEL-ONLY, deliberately. This used to also accept `Lane: light` from the PR BODY,
            # which a fork author writes — so a fork PR could self-declare the light lane and skip
            # the spec-link requirement entirely. A label can only be applied by someone with write
            # access. Recorded as a Tier-A precondition at the 2026-07-27 floor-#3 review
            # ("prefer label-only lane signals"), and live surface since the repo went public.
            # RESIDUAL, stated rather than hidden: the `Spec:` trailer above is still read from the
            # body, because a label cannot carry a spec path. A fork can therefore assert any path.
            # That is bounded — the trailer identifies which spec to check, and the operator's
            # review is what checks it — whereas `Lane: light` bypassed the check altogether.
            summary "spec-link: PASS (not applicable) — light lane (charter-authorized, label-gated)"
          elif ! printf '%s\n' "$files" | grep -qvE '\.(md|txt|png|svg|pdf)$'; then
            summary "spec-link: PASS (not applicable) — docs-only diff"
          else
            summary "spec-link: FAIL — code diff with no lane signal. Add a 'Spec: <workspace spec path>' trailer to the PR body (factory lane), or apply the 'lane:light' LABEL plus a charter (light lane). 'Lane: light' in the body is no longer accepted — a fork author controls the body, so the lane signal is label-gated."
            exit 1
          fi

  security-path:
    runs-on: ubuntu-24.04
    steps:
      - name: security-path gate (always reports)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
          ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          files="$(gh api --paginate "repos/${REPO}/pulls/${PR}/files" -q '.[].filename')"
          labels="$(gh pr view "$PR" --repo "$REPO" --json labels -q '.labels[].name')"
          summary() { printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"; printf '%s\n' "$1"; }
          # DERIVED — see the identical helper in spec-link for why this is not a literal and why
          # it is duplicated rather than shared (both jobs are deliberately checkout-free).
          tier() {
            local p; p="$(gh api "repos/${REPO}/branches/${BASE}" -q .protected 2>/dev/null || echo unknown)"
            # `.protected` is a COARSE boolean — it is true for a branch protected only by
            # "restrict deletions". It proves SOMETHING guards the branch, never that THESE contexts
            # are required, and a read-only token cannot enumerate that (the /protection endpoint is
            # admin-only). So this reports what it can actually substantiate and no more (security
            # review Block 3, 2026-08-04) — the same discipline foundry_tier_preflight.py applies
            # when it refuses to call classic protection Tier A.
            case "$p" in
              true)  printf '**merge floor: `%s` IS server-protected** — some protection is active; this job cannot enumerate WHICH contexts are required with a read-only token' "$BASE" ;;
              false) printf '**merge floor tier: B (advisory)** — `%s` is NOT server-protected; these checks report, the server does not enforce' "$BASE" ;;
              *)     printf '**merge floor: UNKNOWN** — could not read protection state for `%s`; treat as advisory' "$BASE" ;;
            esac
          }
          summary "$(tier)"
          # Security-surface paths (floor-#3 review findings 1/4: UNANCHORED keyword substrings —
          # foundry_authz.py, authorization checks etc. must match — plus .github/ wholesale,
          # hooks/, plugin manifests, shipped version pins/policy, dependency manifests).
          # GP-2 widening (AC-SCW-12/-13, security review required): `^skills/` and `^agents/`
          # added, WHOLESALE (a skill/agent file is prompt-level executable surface — a stale
          # deleted-module mention or a behaviour edit there is not distinguishable from a typo
          # fix by file type). Both new arms are ANCHORED (`^`) so `myskills/`, `skillset/`,
          # `docs/agents-guide.md` and `docs/agents/overview.md` stay clean — see the
          # negative-control rows in tests/fixtures/btb-gates/security-path-matrix.yaml. This is
          # an OR-append only: every existing alternative above is unchanged, so every
          # previously-flagged path stays flagged (widen-only, AC-SCW-13). Expected volume +
          # revisit trigger recorded in the spec's Residuals section.
          # tier-a-ruleset-as-code widening (AC-TARC-15, security review required): `^rulesets/`
          # and `^scripts/foundry_tier_preflight` appended so THIS ATOM's own two new surfaces —
          # the shipped merge-floor ruleset template and the preflight/apply CLI that holds an
          # Administration (write) token on its --apply path — are mechanically floor-#3-routed
          # forever, not just today by operator memory. Both new arms are ANCHORED so
          # `docs/rulesets/notes.md`, `rulesets-recipes/branch.json`, `scripts/foundry_tier.py`,
          # and `scripts/my_foundry_tier_preflight.py` stay clean — see the negative-control rows
          # in tests/fixtures/btb-gates/security-path-matrix.yaml. OR-append only, same discipline
          # as the GP-2 widening above (widen-only, AC-TARC-15).
          hits="$(printf '%s\n' "$files" | grep -E '(auth|secret|credential|token|provenance|signing|\.rego$)|^\.github/|^hooks/|^\.claude-plugin/|(^|/)(standing-versions|profile-version-ledger)|(^|/)(requirements[^/]*\.txt|package(-lock)?\.json|pyproject\.toml|Pipfile[^/]*|go\.(mod|sum)|Cargo\.(toml|lock))$|^skills/|^agents/|^rulesets/|^scripts/foundry_tier_preflight' || true)"
          if [ -z "$hits" ]; then
            summary "security-path: PASS (not applicable) — no auth/secrets/supply-chain path in the diff"
          elif printf '%s\n' "$labels" | grep -qxF 'security-reviewed'; then
            # STALE-LABEL TOCTOU is handled by INVALIDATING THE STATE, not by inspecting this run's
            # event. The first attempt keyed on `github.event.action == "synchronize"` and was
            # bypassable three ways (security review Blocks 1/2, 2026-08-04): an `edited` event
            # re-ran the gate green at the same head; removing and re-adding the label re-ran it as
            # `labeled` — which the failure message literally instructed the user to do; and
            # close→push→reopen never emits `synchronize` at all. An event is a moment; the question
            # "was this diff reviewed" is about STATE.
            #
            # `.github/workflows/security-label-reset.yml` now strips the label whenever commits
            # land, so by the time this arm reads it the label means "reviewed at THIS head" — and
            # every one of those three bypasses ends with no label rather than a stale one.
            summary "security-path: PASS — security-flagged paths present AND 'security-reviewed' label posted (floor #3 review recorded)"
            printf 'flagged paths:\n%s\n' "$hits"
          else
            summary "security-path: FAIL — diff touches security surfaces with no 'security-reviewed' label. Run the security-reviewer pass, then label the PR."
            printf 'flagged paths:\n%s\n' "$hits"
            exit 1
          fi

  shell-parse-bash32:
    # feat-foundry-bash32-parse-guard, AC-B32-4..8,10,12. Always runs (no `if:`); fails closed
    # (no `continue-on-error`) on any of: a mis-resolved image, a collapsed discovery, or a real
    # bash-3.2 parse failure. Discovery, never enumeration: the covered set is derived from
    # `git ls-files` at run time, so a newly added shipped shell script is covered with no edit
    # to this job.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout (read-only; a parse gate over the repo's own files cannot avoid it)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: bash-3.2 parse gate (always reports)
        run: |
          set -euo pipefail
          # Bash 3.2 pin — the version Apple still ships as /bin/bash on macOS. RESOLVED and
          # VERIFIED by pulling the image (2026-07-28): BASH_VERSION 3.2.57(1)-release; the image
          # carries no python3. Fully-qualified canonical form, pinned by immutable digest — the
          # human tag (bash:3.2) never appears in an executable position, only here as a comment.
          IMG="docker.io/library/bash@sha256:3a13e5da38baa575985778cd09ce8ac736d4b4dafc91a430e71271f6e5311b89"

          summary() { printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"; printf '%s\n' "$1"; }
          summary "**merge floor tier: B (advisory)** — private repo, Free plan; checks report, server does not enforce"

          # AC-B32-10: a digest pins immutability, not identity — a digest resolved off a
          # modern-bash tag would make every checkpoint here pass while checking nothing it
          # claims to. Assert the resolved image really reports bash 3.2 before trusting it for
          # anything below; reject and stop rather than run `bash -n` under the wrong interpreter.
          version_line="$(docker run --rm --entrypoint bash "$IMG" --version | head -1)"
          case "$version_line" in
            *"version 3.2"*) : ;;
            *)
              summary "shell-parse-bash32: FAIL — resolved image does not report bash 3.2 (${version_line})"
              exit 1
              ;;
          esac

          # AC-B32-6: discovery, never enumeration — the job body names no shell-script filename.
          # Per-directory minima guard a collapsed discovery query (an empty/short covered set is
          # itself a failure: a gate that checks nothing must not report green); the ACTUAL
          # covered set driven through `bash -n` below is the full shipped-shell-script set,
          # a strict superset of the two directories the minima bound.
          hook_count="$(git ls-files hooks | grep -c -e '[.]sh$' || true)"
          script_count="$(git ls-files scripts | grep -c -e '[.]sh$' || true)"
          if [ "${hook_count:-0}" -lt 11 ]; then
            summary "shell-parse-bash32: FAIL — discovery found only ${hook_count:-0} hooks/*.sh (minimum 11) — discovery collapsed"
            exit 1
          fi
          if [ "${script_count:-0}" -lt 5 ]; then
            summary "shell-parse-bash32: FAIL — discovery found only ${script_count:-0} scripts/*.sh (minimum 5) — discovery collapsed"
            exit 1
          fi

          failures=0
          parsed=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            parsed=$((parsed + 1))
            if ! docker run --rm --entrypoint bash -v "$PWD:/src:ro" -w /src "$IMG" -n "/src/$f"; then
              summary "shell-parse-bash32: FAIL — ${f} does not parse under bash 3.2"
              failures=$((failures + 1))
            fi
          done < <(git ls-files | grep -e '[.]sh$')

          if [ "$failures" -gt 0 ]; then
            summary "shell-parse-bash32: FAIL — ${failures} of ${parsed} shipped shell script(s) failed to parse under bash 3.2 (tier B, advisory — reports, does not server-side block on this repo's current plan)"
            exit 1
          fi
          summary "shell-parse-bash32: PASS — all ${parsed} shipped shell script(s) parse under bash 3.2 (tier B, advisory — reports, does not server-side block on this repo's current plan)"
