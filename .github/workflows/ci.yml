# .github/workflows/ci.yml — Agentic Foundry gate selftests on every PR.
# The floor must stay green; CI runs the real pytest suite (the v0.25.0 test-suite
# realignment — "one real test suite") + doctor + the machinery not yet covered by pytest.
name: ci
on:
  push:
    branches: [main]
  pull_request:
# Least-privilege default (floor-#3 review R6): read-only unless a job needs more.
permissions:
  contents: read
jobs:
  selftests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # FULL history (not the default shallow depth-1), matching the secret-scan job below,
          # which already checks out this way; release-acceptance stays shallow (it needs none).
          # The suite carries history-dependent assertions that compare a shipped file against its
          # MERGE-BASE blob, falling back to `git merge-base HEAD origin/main` when no checkpoint
          # locator supplied the baseline. Those cases FAIL CLOSED (never skip) when no baseline can
          # be produced — by design, so a missing baseline is RED rather than a silent pass. Under
          # depth-1 there is no `origin/main` remote-tracking ref at all, so they failed for want of
          # history rather than for a real delta and took the whole job red with it.
          # `fetch-depth: 0` is actions/checkout's own documented remedy for history-needing jobs —
          # it fetches every branch, which is what makes `origin/main` resolvable here. Cheap at
          # this repo's size.
          #
          # This hunk is intentionally byte-identical across the three atoms landing it in this wave
          # (release-wave-workflow-syntax, init-slimming, docs-truth-reconciliation) so they merge in
          # any order; it names no single test, because the citing tests do not all exist on every
          # one of those branches. It is inert on a branch that has none of them, and required by the
          # first one that lands.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install (PyYAML/jsonschema for the gate scripts + the pytest dev requirements)
        run: |
          pip install -r requirements-dev.txt
      - name: pytest suite (replaces the per-script --selftest step battery)
        # The denylist reaches the suite by CONTENT so AC-DOT-1(b) — "no proprietary term survives in
        # any tracked file" — actually runs here rather than skipping in the one place that gates a
        # merge. It is empty on a fork PR (secrets do not resolve), where that test reports NOT-RUN
        # and claims no coverage rather than passing vacuously.
        env:
          FOUNDRY_LEAK_DENYLIST: ${{ secrets.FOUNDRY_LEAK_DENYLIST }}
        # AC-INS-5's byte-identity case takes its baseline from INIT_SLIMMING_BASE and FAILS (never
        # skips) when that is unset — deliberate, so a missing baseline is RED rather than a silent
        # pass. Its frozen contract supplies the var from the CHECKPOINT LOCATOR; the bare
        # `pytest tests/ -q` here has no locator, so the job must resolve the same blob itself.
        # Depends on the full-history checkout above.
        #
        # THE SHA IS RESOLVED INTO A VARIABLE FIRST, AND CHECKED, rather than interpolated straight
        # into `git show` (PR #65 security review Block 1). The obvious one-liner
        #   git show "$(git merge-base HEAD origin/main):skills/init/SKILL.md" > "$base"
        # is FAIL-OPEN in a way that is easy to miss and was verified by hand here:
        #   * errexit cannot see it. A command substitution inside a WORD of another command does
        #     not contribute its status — the simple command's status is `git show`'s alone. (The
        #     assignment form on the next line is the opposite case: there the substitution IS the
        #     command, so errexit does fire.) The step already runs under `bash -e {0}`, so a bare
        #     `set -e` adds nothing.
        #   * An empty substitution yields a VALID ref, not an error: `git show ":<path>"` is git's
        #     index-stage-0 syntax, so it resolves against the CURRENT INDEX, exits 0, and writes
        #     the PR's own post-change file as the "baseline".
        #   * The assertion then compares the file to ITSELF and passes, proving nothing, with no
        #     red step anywhere. Measured: the recipe emitted 20057 bytes (byte-for-byte the current
        #     file) and the case reported `1 passed`.
        # So the guard that actually matters is `[ -n "$base_sha" ]`, not `set -e`. `-s` on the blob
        # is the belt to that braces.
        run: |
          set -euo pipefail
          base_sha="$(git merge-base HEAD origin/main)"
          [ -n "$base_sha" ] || { echo "::error::no merge-base with origin/main (needs fetch-depth: 0)"; exit 1; }
          INIT_SLIMMING_BASE="$(mktemp)"
          git show "${base_sha}:skills/init/SKILL.md" > "$INIT_SLIMMING_BASE"
          [ -s "$INIT_SLIMMING_BASE" ] || { echo "::error::empty AC-INS-5 baseline"; exit 1; }
          export INIT_SLIMMING_BASE
          python3 -m pytest tests/ -q
      # AC-CXZ-13 — the re-entry guard. The 400-line reference-sweep gate this atom deleted was
      # retired because it had become the largest instance of what it banned AND shipped to every
      # adopter (a plugin install is a full clone with no file-exclusion mechanism). That reasoning
      # retires the GATE, not the invariant: the retired framework's name stays typeable by any
      # contributor, and this repo is public. So the zero state keeps a guard — one line of the same
      # bare, allowlist-free locator the atom's own exit criterion uses. It lives in CI, not in the
      # shipped tree, which is the whole point: it protects the repo without reaching adopters.
      - name: Retired-framework re-entry guard (zero occurrences, allowlist-free)
        run: |
          set -euo pipefail
          # Self-exclusion, and ONLY self-exclusion: a token guard must spell the token to detect
          # it, so this one file is excluded by path. That is the secret-scanner precedent (allowlist
          # the fixture, never hide the token) and it is the whole allowlist -- one path, stated
          # here, versus the 232-line allowlist corpus the retired gate carried.
          #
          # EXIT-STATUS DISCRIMINATION, not a bare pipeline. `git grep` exits 1 on no-match (the
          # green case) and 2+ on a real error. Assigning from a pipe ending in `wc -l` would make
          # the status always 0, so ANY grep failure -- bad pathspec, corrupt index, I/O -- would
          # print 0 and report GREEN having scanned nothing. That is the same fail-open shape a
          # prior security review found in this file's merge-base step; it is refused here too.
          if out="$(git grep -lIi 'ctx' -- . ':!.github/workflows/ci.yml')"; then
            n="$(printf '%s\n' "$out" | grep -c . || true)"
          else
            rc=$?
            if [ "$rc" -ne 1 ]; then
              echo "::error::re-entry guard could not run (git grep rc=$rc) - failing closed"
              exit 1
            fi
            n=0
          fi
          if [ "$n" -ne 0 ]; then
            echo "::error::retired-framework token re-entered the tree ($n file(s))"
            # PATHS ONLY. Echoing matched file CONTENT would put fork-controlled text into the
            # Actions workflow-command parser (::error::, ::add-mask::, ::stop-commands::).
            printf '%s\n' "$out" | head -50
            exit 1
          fi
          echo "RE-ENTRY-GUARD-GREEN (0 files)"
      # feat-foundry-main-catalogue-coherence (AC-MCC-5). The hermetic pytest module above already
      # ran on both push AND pull_request. This step is the LIVE-TREE assertion, and it MUST stay
      # scoped to push-to-default-branch only: main legitimately advertises a version whose
      # source.sha still names the previous release's revision for the span between the
      # version-bump PR (R) and the re-pin PR (R2) — see the spec's "Clarifications". Removing the
      # `if:` guard would turn every version-bump PR permanently red and make the release runbook
      # unexecutable, trading a silent defect for a blocked release.
      - name: Default-branch catalogue coherence (push-to-main only)
        if: github.event_name == 'push'
        run: python3 scripts/foundry_main_catalogue.py --tree . --default-branch main
      - name: Graph builder selftest
        run: python3 scripts/foundry-build-citation-graph.py --selftest
      - name: Graph MCP selftest
        run: python3 scripts/foundry-graph-mcp.py --selftest
      - name: Doctor (fail-closed health check)
        run: python3 scripts/foundry-doctor.py
      - name: Workflow syntax
        run: node --check workflows/spec-audit.js && node --check workflows/release-wave.js
      - name: Bootstrap selftest
        run: bash scripts/foundry-bootstrap.sh --selftest
      - name: Leak gate (no proprietary refs ship)
        # The term list is NOT in this repository (feat-foundry-denylist-out-of-tree). It arrives as
        # a secret and is materialized outside the checkout for the duration of the scan. Terms are
        # never enumerated inline here, and the gate never echoes a matched term — a public Actions
        # log would otherwise republish the very term the gate exists to protect.
        #
        # `is-fork-pr` MUST come from the event payload, never from the secret being empty: on a fork
        # PR secrets do not resolve and the gate degrades to markers-only, but an empty secret on any
        # OTHER event means it is unset/misconfigured and the gate REFUSES. Conflating the two would
        # silently downgrade every push to main the moment the secret is deleted.
        #
        # pull_request_target is deliberately NOT used: it runs with secrets against untrusted code,
        # trading a disclosure risk for a code-execution risk.
        uses: ./.github/actions/leak-gate
        with:
          denylist: ${{ secrets.FOUNDRY_LEAK_DENYLIST }}
          is-fork-pr: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true }}

  # Mechanical secret scan over the PR diff (floor-#3 review R5) — restores, as a CI step, the ONE
  # machine-enforced control the retired merge-side status-poster workflow used to run pre-merge.
  # Drives the kept deterministic scanner (scripts/foundry_security_review.py's scan_candidate — a pinned
  # high-signal ruleset: PEM/private-key blocks, AWS/GCP/GitHub/Slack tokens, JWTs, bearer tokens,
  # generic secret assignments, PLUS a base64/hex entropy heuristic) over every file the PR actually
  # changed. The changed-file set is computed from the TRUSTED webhook event base/head SHAs (never a
  # PR-supplied ref) — the same "trusted event SHAs" pattern the deleted status workflow used
  # (`git diff --raw --no-renames $BASE_SHA $HEAD_SHA`). Skips cleanly on a push-to-main event (no PR
  # base/head SHAs to diff against — nothing new to scan that wasn't already scanned on its own PR).
  secret-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Determine changed files (base...head, from trusted event SHAs)
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --raw --no-renames "$BASE_SHA" "$HEAD_SHA" > /tmp/secret-scan-diff-raw.txt
          python3 - <<'PYEOF'
          with open("/tmp/secret-scan-diff-raw.txt") as fh, open("/tmp/secret-scan-changed-files.txt", "w") as out:
              for line in fh:
                  line = line.rstrip("\n")
                  if not line.strip() or "\t" not in line:
                      continue
                  _meta, path = line.split("\t", 1)
                  out.write(path + "\n")
          PYEOF
          cat /tmp/secret-scan-changed-files.txt
      - name: Mechanical secret scan (scripts/foundry_security_review.py scan_candidate)
        run: |
          python3 - <<'PYEOF'
          import sys
          sys.path.insert(0, "scripts")
          import foundry_security_review as review

          with open("/tmp/secret-scan-changed-files.txt") as fh:
              changed = [ln.strip() for ln in fh if ln.strip()]

          findings = review.scan_candidate(changed, adopter_root=".")
          # ADVISORY (report-only) until the entropy allowlist is tuned — measured 108 false
          # positives on the Phase-2b branch itself (long path strings + the doctor's own
          # documented key/PEM test fixtures trip the heuristic). A chronically-red blocking
          # check trains bypass, which is worse than visibility-only. TODO(phase-4 skill/hygiene sweep — re-dated 2026-07-27, was phase-3; the tuning
          # did not land in Phase 3 and this note says so honestly): tune scan_candidate's
          # allowlist/fixture handling, then remove this advisory guard so findings fail again.
          if findings:
              print(f"SECRET-SCAN (ADVISORY): {len(findings)} finding(s) — review below; job does NOT fail until the Phase-3 tuning lands:")
              for f in findings:
                  print(f"  [{f['severity']}] {f['category']} @ {f['location']}: {f['rationale']}")
              sys.exit(0)
          print(f"SECRET-SCAN: clean ({len(changed)} file(s) scanned, 0 findings)")
          PYEOF

  # Release acceptance-gate (feat-foundry-release-acceptance-gate) — validate the ARTIFACT as a fresh client
  # receives it, using the tool's OWN first-party validators, BEFORE the cut. Guarded to TRUSTED refs only
  # (push to main / tags, or a same-repo PR) — never a fork pull_request HEAD, since the gate runs the
  # candidate's own validators/doctor. The binding enforcement is the /foundry:release pre-cut hard-stop
  # (run locally where `claude` is always present); this CI job is the earlier advisory signal.
  release-acceptance:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install deps (PyYAML/jsonschema + the Claude Code CLI for the first-party validators)
        run: |
          pip install -r requirements-dev.txt
          # TODO(standing-versions): @anthropic-ai/claude-code has no pin in docs/standing-versions.md
          # yet (only actions/checkout|setup-python|setup-node are researched + pinned there). Floats
          # on latest until a version is researched + added to the matrix+lock — track before the next
          # infra-upgrade reconciliation pass (docs/standing-versions.md §4).
          npm install -g @anthropic-ai/claude-code
      - name: Release acceptance-gate over the checked-out artifact
        run: python3 scripts/foundry-release-acceptance.py --tree .
