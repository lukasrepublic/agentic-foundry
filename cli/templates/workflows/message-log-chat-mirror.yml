# message-log-chat-mirror.yml -- OPT-IN, OFF BY DEFAULT.
#
# Mirrors only the production before/after lines of the shared message log (PROD-BEFORE, PROD-AFTER) to a chat
# channel. It is a convenience, not a record: the record is the `foundry/messages` branch.
#
# It costs runner minutes (one short job per schedule tick), which is why it is opt-in. To turn it on:
#   1. set `messaging.chat_mirror: on` in .foundry/operating-model.yaml (the declaration),
#   2. set the repository variable MESSAGE_LOG_CHAT_MIRROR to `on` (the switch this job checks),
#   3. add the repository secret MESSAGE_LOG_CHAT_WEBHOOK (an incoming-webhook URL that accepts {"text": "..."}).
# With the variable unset, every tick ends at the job-level `if` and starts no runner.
#
# Lines are picked by their `time` field over the last window (16 minutes for a 15 minute schedule), so a
# line can repeat after a delayed schedule; that is the price of a stateless mirror.
name: message-log-chat-mirror

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    if: ${{ vars.MESSAGE_LOG_CHAT_MIRROR == 'on' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: foundry/messages
          fetch-depth: 1
          persist-credentials: false
      - name: Post new PROD-BEFORE and PROD-AFTER lines
        env:
          CHAT_WEBHOOK_URL: ${{ secrets.MESSAGE_LOG_CHAT_WEBHOOK }}
        run: |
          set -euo pipefail
          if [ -z "${CHAT_WEBHOOK_URL}" ]; then echo "MESSAGE_LOG_CHAT_WEBHOOK is not set" >&2; exit 1; fi
          [ -d messages ] || exit 0
          since=$(( $(date -u +%s) - 960 ))
          cat messages/*.jsonl | jq -r --argjson since "${since}" '
            select(.kind == "PROD-BEFORE" or .kind == "PROD-AFTER")
            | select((.time[0:19] + "Z" | fromdateiso8601) >= $since)
            | "\(.kind) \(.corr // "-") from \(.from): \(.body[0:300] | gsub("\n"; " "))"' |
          while IFS= read -r line; do
            jq -n --arg text "${line}" '{text: $text}' |
              curl --fail --silent --show-error --max-time 20 -H 'Content-Type: application/json' -d @- "${CHAT_WEBHOOK_URL}"
          done
