name: merge-waits-with-primitive
description: >
  autonomy-continuation R2 "gates stop lying" (v1.13.0) mining fixture — measured 90
  sleep-blocks and 83 "pending checks" refusals across a single release before
  `/foundry:merge-when-green` replaced the hand-rolled sleep-then-poll loop
  (scripts/foundry-merge-when-green.py). This case stubs `gh` on PATH (via scaffold_script, run
  only with `--scaffold`) so a PR's checks report green on the first query, and checks that
  Claude reaches for the primitive instead of writing its own poll loop with `sleep`.
