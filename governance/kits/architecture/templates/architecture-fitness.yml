# Architecture fitness gate. Replace the run line with the tool from checks/bindings.yaml.
# Researched 2026-11-04.
# Adopters: copy governance/kits/architecture/checks/adr_lint.py from the plugin into the repository
# (for example to tools/adr_lint.py) and install PyYAML at the version pinned in your version matrix.
# The lines below use the plugin path only as a placeholder. Keep the checkout pinned to a commit SHA (FG-STK-003).
name: architecture-fitness
on: [pull_request]
permissions:
  contents: read
jobs:
  fitness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Architecture check (new violations fail; baseline tolerated)
        run: lint-imports
      - name: Install conftest (pinned, checksum-verified)
        # conftest v0.68.2, release and checksum verified 2026-11-04 against the upstream checksums.txt.
        run: |
          curl -fsSL -o conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/download/v0.68.2/conftest_0.68.2_Linux_x86_64.tar.gz
          echo "e8144c6d6d2ae0260b869caa60c7c262a1f95ac63ec1e5d2fb19be452d606347  conftest.tar.gz" | sha256sum -c -
          tar -xzf conftest.tar.gz conftest
      - name: Version pinning policy (copy pinning.rego from the stack kit to policy/)
        run: ./conftest test --policy policy --namespace governance.pinning .github/workflows
      - name: ADR lint
        run: python3 tools/adr_lint.py docs/decisions
