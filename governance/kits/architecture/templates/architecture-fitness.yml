# Architecture fitness gate. Replace the run line with the tool from checks/bindings.yaml.
# Researched 2026-11-04. Keep the checkout pinned to a commit SHA (FG-STK-003).
name: architecture-fitness
on: [pull_request]
permissions:
  contents: read
jobs:
  fitness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Architecture check (new violations fail; baseline tolerated)
        run: lint-imports
      - name: ADR lint
        run: python3 governance/kits/architecture/checks/adr_lint.py docs/decisions
