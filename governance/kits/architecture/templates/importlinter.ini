# import-linter. Replace the package and layer names. Source of truth for layers is the stack profile
# architecture.allowed_dependencies. Researched 2026-11-04.
[importlinter]
root_package = mypackage

[importlinter:contract:layers]
name = Layers and allowed direction
type = layers
layers =
    mypackage.interface
    mypackage.application
    mypackage.domain

[importlinter:contract:external]
name = Domain imports no framework
type = forbidden
source_modules = mypackage.domain
forbidden_modules = flask
