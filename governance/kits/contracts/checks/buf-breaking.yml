# Breaking-change gate for protobuf against main. Researched 2026-11-04.
# Install buf at the version pinned in your version matrix.
name: proto-breaking
on: [pull_request]
permissions:
  contents: read
jobs:
  buf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: buf breaking against main
        run: buf breaking --against '.git#branch=origin/main'
