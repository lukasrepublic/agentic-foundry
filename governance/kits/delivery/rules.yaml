kit: delivery
version: 1.0.0
rules:
  - id: FG-DLV-001
    title: Branch discipline
    statement: Work MUST happen on a branch per ticket and MUST reach a protected branch by pull request. A force-push to a protected branch MUST NOT happen.
    category: delivery
    level: 1
    floor: true
    status: active
    applies_to: {paths: ["**"], blueprints: ["*"]}
    check: {kind: hook, ref: hooks/foundry-git-discipline.sh}
    exception: {allowed: false}
    sources: ["GitHub docs, about protected branches (2026-11-04)", "Foundry governance design 2026-11-04, section 2.7"]
  - id: FG-DLV-002
    title: Conventional commits enforced by commitlint
    statement: Commit messages MUST follow the Conventional Commits format, and CI MUST check them with commitlint.
    category: delivery
    level: 1
    floor: false
    status: active
    applies_to: {paths: ["**"], blueprints: ["*"]}
    check: {kind: lint, ref: governance/kits/delivery/checks/commitlint.config.js}
    exception: {allowed: true, requires: [reason, owner, expires]}
    sources: ["Conventional Commits 1.0.0 (2026-11-04)", "commitlint documentation (2026-11-04)"]
  - id: FG-DLV-003
    title: The SemVer bump is derived from commits
    statement: The version bump MUST be derived from the commit types by tooling, and a person MUST NOT hand-pick it. A breaking change MUST be marked in the commit.
    category: delivery
    level: 1
    floor: false
    status: active
    applies_to: {paths: ["**"], blueprints: ["*"]}
    check: {kind: ci, ref: governance/kits/delivery/checks/release-please-config.json}
    exception: {allowed: true, requires: [reason, owner, expires]}
    sources: ["Semantic Versioning 2.0.0 (2026-11-04)", "release-please documentation (2026-11-04)"]
  - id: FG-DLV-004
    title: Merge the base first, then test what changed
    statement: Before a PR enters the merge queue, the target branch MUST be merged into the PR branch, and the tests that cover what changed MUST then run on that merged result.
    category: delivery
    level: 1
    floor: true
    status: active
    applies_to: {paths: ["**"], blueprints: ["*"]}
    check: {kind: ci, ref: scripts/foundry_queue_land.py}
    exception: {allowed: false}
    note: Binds scripts/foundry_queue_land.py (shipped by gv-10). Operating model rule A2, obligation 1.
    sources: ["Foundry operating model rule A2 (2026-11-04)", "GitHub docs, managing a merge queue (2026-11-04)"]
  - id: FG-DLV-005
    title: Coarse PRs and a merge plan
    statement: Work for one area SHOULD land in one coarse PR, and a merge plan SHOULD order PRs so that a shared catalogue changes once per round.
    category: delivery
    level: 2
    floor: false
    status: active
    applies_to: {paths: ["**"], blueprints: ["*"]}
    check: {kind: declared, ref: scripts/foundry_merge_plan.py}
    exception: {allowed: true, requires: [reason, owner, expires]}
    note: Binds scripts/foundry_merge_plan.py (shipped by gv-10). Operating model rule A1.
    sources: ["Foundry operating model rule A1 (2026-11-04)", "Google engineering practices, small CLs (2026-11-04)"]
  - id: FG-DLV-006
    title: Full suite only when required
    statement: A branch MUST NOT run the full test suite unless a shared catalogue changed or a queue rejection occurred. Otherwise the queue's own run is the gate. A diagnostic run MUST be cancelled as soon as a lane goes red.
    category: delivery
    level: 2
    floor: false
    status: active
    applies_to: {paths: ["**"], blueprints: ["*"]}
    check: {kind: declared, ref: scripts/foundry_queue_land.py}
    exception: {allowed: true, requires: [reason, owner, expires]}
    note: Policy key merge.full_suite_on_branch. Operating model rule A3.
    sources: ["Foundry operating model rule A3 (2026-11-04)"]
  - id: FG-DLV-007
    title: Release cadence floor and release record
    statement: A project MUST release at least once per period it declares, and each release MUST leave a release record that names the version and the commit.
    category: delivery
    level: 2
    floor: false
    status: active
    applies_to: {paths: ["**"], blueprints: ["*"]}
    check: {kind: declared, ref: governance/kits/delivery/checks/release-please-config.json}
    exception: {allowed: true, requires: [reason, owner, expires]}
    sources: ["Accelerate / DORA delivery metrics (2026-11-04)", "Foundry governance design 2026-11-04, section 2.7"]
  - id: FG-DLV-008
    title: Feature flags are cleaned up
    statement: Each feature flag SHOULD carry an owner and a removal date, and a flag past its removal date SHOULD be removed from the code.
    category: delivery
    level: 2
    floor: false
    status: active
    applies_to: {paths: ["**"], blueprints: ["*"]}
    check: {kind: review-lens, ref: agents/pr-reviewer.md}
    exception: {allowed: true, requires: [reason, owner, expires]}
    note: The flag-cleanup lens is added to agents/pr-reviewer.md by gv-16.
    sources: ["Uber Piranha, automated stale feature flag cleanup (2026-11-04)", "Foundry governance design 2026-11-04, section 2.7"]
  - id: FG-DLV-009
    title: CODEOWNERS covers governed paths
    statement: Every governed path SHOULD have an owner in CODEOWNERS, and branch protection SHOULD require owner review for those paths unless merge.human_review_required is false, which is the default. Agent review (FG-QA-001) is the floor.
    category: delivery
    level: 2
    floor: false
    status: active
    applies_to: {paths: ["**"], blueprints: ["*"]}
    check: {kind: ci, ref: governance/kits/delivery/templates/CODEOWNERS.template}
    exception: {allowed: true, requires: [reason, owner, expires]}
    note: Operating model rule A4. Human code-owner review is optional by configuration.
    sources: ["GitHub docs, about code owners (2026-11-04)", "Foundry operating model rule A4 (2026-11-04)"]
  - id: FG-DLV-010
    title: Never edit CI to make a PR pass
    statement: A PR MUST NOT edit CI workflows, CI scripts, test configs or quarantine lists to make that PR pass.
    category: delivery
    level: 1
    floor: true
    status: active
    applies_to:
      paths:
        - ".github/**"
        - ".gitlab-ci.yml"
        - ".circleci/**"
        - "Jenkinsfile"
        - "azure-pipelines.yml"
        - "scripts/ci/**"
        - "ci/**"
        - "Makefile"
        - "pyproject.toml"
        - "setup.cfg"
        - ".coveragerc"
        - "**/pytest.ini"
        - "**/conftest.py"
        - "**/tox.ini"
        - "**/jest.config.*"
        - "**/vitest.config.*"
        - "**/playwright.config.*"
        - "**/karma.conf.*"
        - ".mocharc.*"
        - "**/quarantine*.yaml"
        - "**/quarantine*.yml"
        - "**/quarantine*.json"
      blueprints: ["*"]
    check: {kind: hook, ref: hooks/foundry-paper-guard.py}
    exception: {allowed: false}
    note: Enforced by the paper guard's ci class (hooks/foundry-paper-guard.py, gv-10). The only admitted path is a ticket that names the file in ci_allowed, which is the operator's grant and not an exception to this rule. Operating model rule A2.
    sources: ["Foundry operating model rule A2 (2026-11-04)"]
  - id: FG-DLV-011
    title: A delivery record names who delivered it
    statement: The delivered-PR field MUST be written in the same action as the merge. Authorship alone MUST NOT be taken as proof of attestation.
    category: delivery
    level: 1
    floor: true
    status: active
    applies_to: {paths: ["**"], blueprints: ["*"]}
    check: {kind: ci, ref: scripts/foundry_queue_land.py}
    exception: {allowed: false}
    note: Shipped record shape is PR, merger login and head sha. Binds scripts/foundry_queue_land.py (gv-10) and scripts/foundry-merge-when-green.py. Agent identity can equal the operator's git identity. Operating model rule G2.
    sources: ["Foundry operating model rule G2 (2026-11-04)"]
  - id: FG-DLV-012
    title: A shared catalogue change runs every test that names it
    statement: A change to a shared catalogue MUST run every test that names that catalogue before the PR is enqueued.
    category: delivery
    level: 1
    floor: true
    status: active
    applies_to: {paths: ["**"], blueprints: ["*"]}
    check: {kind: ci, ref: scripts/foundry_queue_land.py}
    exception: {allowed: false}
    note: Binds scripts/foundry_queue_land.py (gv-10). Operating model rule A2, obligation 2.
    sources: ["Foundry operating model rule A2 (2026-11-04)"]
  - id: FG-DLV-013
    title: Enqueue only on a green required check at the current head
    statement: A PR MUST be enqueued only on a green required check at its current head.
    category: delivery
    level: 1
    floor: true
    status: active
    applies_to: {paths: ["**"], blueprints: ["*"]}
    check: {kind: ci, ref: scripts/foundry_queue_land.py}
    exception: {allowed: false}
    note: Binds scripts/foundry_queue_land.py (gv-10). Operating model rule A2, obligation 3.
    sources: ["Foundry operating model rule A2 (2026-11-04)"]
  - id: FG-DLV-014
    title: No bypass flags, and no push to a queued PR
    statement: A merge MUST NOT use admin bypass, auto-merge or force flags. A push to a queued PR MUST NOT happen. The PR MUST be dequeued first.
    category: delivery
    level: 1
    floor: true
    status: active
    applies_to: {paths: ["**"], blueprints: ["*"]}
    check: {kind: hook, ref: hooks/foundry-git-discipline.sh}
    exception: {allowed: false}
    note: Binds hooks/foundry-git-discipline.sh; the bypass-flag and queued-PR clauses are shipped by gv-10. A CI script cannot see a push or a flag. Operating model rule A2, obligation 4.
    sources: ["Foundry operating model rule A2 (2026-11-04)", "GitHub docs, managing a merge queue (2026-11-04)"]
  - id: FG-DLV-015
    title: Read the queue entry twice
    statement: After enqueue, the queue entry MUST be read twice, because it can appear late.
    category: delivery
    level: 1
    floor: true
    status: active
    applies_to: {paths: ["**"], blueprints: ["*"]}
    check: {kind: ci, ref: scripts/foundry_queue_land.py}
    exception: {allowed: false}
    note: Binds scripts/foundry_queue_land.py (gv-10). Operating model rule A2, obligation 5.
    sources: ["Foundry operating model rule A2 (2026-11-04)"]
  - id: FG-DLV-016
    title: Post the one-line record before each enqueue
    statement: Before each enqueue, the actor MUST post the one-line record "PR | head | base merged at | catalogue tests | branch full suite | queued". If a column cannot be filled honestly, the PR MUST NOT be queued.
    category: delivery
    level: 1
    floor: true
    status: active
    applies_to: {paths: ["**"], blueprints: ["*"]}
    check: {kind: ci, ref: scripts/foundry_queue_land.py}
    exception: {allowed: false}
    note: Binds scripts/foundry_queue_land.py (gv-10). Operating model rule A2, obligation 6.
    sources: ["Foundry operating model rule A2 (2026-11-04)"]
  - id: FG-DLV-017
    title: On a rejection, read the failed log first
    statement: On a queue rejection the failed log MUST be read first. A failure in the PR's own files MUST be fixed. For a failure outside the diff, the evidence MUST be posted before any re-queue, and the PR MUST NOT be re-queued more than once. The same failure a second time (the same failing test id or an identical failure signature) MUST go to the test owner as a quarantine request, and there MUST NOT be a third roll.
    category: delivery
    level: 1
    floor: true
    status: active
    applies_to: {paths: ["**"], blueprints: ["*"]}
    check: {kind: ci, ref: scripts/foundry_queue_land.py}
    exception: {allowed: false}
    note: Binds scripts/foundry_queue_land.py (gv-10). Operating model rule A2, obligation 7.
    sources: ["Foundry operating model rule A2 (2026-11-04)"]
  - id: FG-DLV-018
    title: A skipped check is not a pass
    statement: A skipped check MUST NOT be counted as a pass. The workflow that owns the check MUST be read to tell a skip from a pass.
    category: delivery
    level: 1
    floor: true
    status: active
    applies_to: {paths: ["**"], blueprints: ["*"]}
    check: {kind: ci, ref: scripts/foundry_queue_land.py}
    exception: {allowed: false}
    note: Binds scripts/foundry_queue_land.py (gv-10). Operating model rule A2, obligation 8.
    sources: ["Foundry operating model rule A2 (2026-11-04)"]
  - id: FG-DLV-019
    title: Read the live ruleset before relying on it
    statement: The live ruleset MUST be read before it is relied on. A queue waits only for the checks the ruleset names, so a PR MUST NOT be enqueued when the base's ruleset names no required status check.
    category: delivery
    level: 1
    floor: true
    status: active
    applies_to: {paths: ["**"], blueprints: ["*"]}
    check: {kind: ci, ref: scripts/foundry_queue_land.py}
    exception: {allowed: false}
    note: Binds scripts/foundry_queue_land.py (gv-10). Operating model rule A2, obligation 9.
    sources: ["Foundry operating model rule A2 (2026-11-04)", "GitHub docs, about rulesets (2026-11-04)"]
