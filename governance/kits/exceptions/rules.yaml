kit: exceptions
version: 1.0.0
rules:
  - id: FG-EXC-001
    title: Every exception is recorded
    statement: An exception MUST name the rule id, scope, reason, owner and expiry. It MUST be reported as a skip, never as a pass, and an expired one MUST fail the check.
    category: exceptions
    level: 1
    floor: true
    status: active
    applies_to: {paths: ["**"], blueprints: ["*"]}
    check: {kind: ci, ref: scripts/foundry_governance.py}
    exception: {allowed: false}
    sources: ["Foundry governance design 2026-11-04, section 2.14"]
  - id: FG-EXC-002
    title: Brownfield baseline per check
    statement: An existing violation SHOULD be frozen in a committed baseline per check. Only new violations MUST fail.
    category: exceptions
    level: 1
    floor: false
    status: active
    applies_to: {paths: ["**"], blueprints: ["*"]}
    check: {kind: ci, ref: scripts/foundry_governance.py}
    exception: {allowed: true, requires: [reason, owner, expires]}
    sources: ["Foundry governance design 2026-11-04, section 2.14"]
  - id: FG-EXC-003
    title: New rules start observe-only
    statement: A new rule SHOULD enter observe-only mode and report before it blocks.
    category: exceptions
    level: 2
    floor: false
    status: active
    applies_to: {paths: ["**"], blueprints: ["*"]}
    check: {kind: declared, ref: governance/README.md}
    exception: {allowed: true, requires: [reason, owner, expires]}
    sources: ["Foundry governance design 2026-11-04, section 2.14"]
  - id: FG-EXC-004
    title: Rules change by amendment
    statement: A rule MUST change only by amendment in the kit or the adopter layer. A Design MAY deviate if it cites the rule and gives a justification.
    category: exceptions
    level: 1
    floor: false
    status: active
    applies_to: {paths: ["**"], blueprints: ["*"]}
    check: {kind: review-lens, ref: skills/pr-reviewer}
    exception: {allowed: true, requires: [reason, owner, expires]}
    sources: ["Foundry governance design 2026-11-04, section 2.14"]
