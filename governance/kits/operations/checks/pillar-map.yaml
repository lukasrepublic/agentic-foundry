# Well-Architected pillar checklist ids mapped to repo facts. A scorecard: a report, not a gate.
# Every entry is a proxy: the repo fact is a signal near the pillar topic, not proof that the best practice
# is met. The ids are nearest-topic references and are not source-verified; confirm each against the pillar's
# own page before relying on it. Each entry: id, pillar, proxy, fact, paths (any one present counts).
pillars:
  - id: OPS01-BP01
    pillar: operational-excellence
    proxy: true
    fact: "Ownership is recorded: a CODEOWNERS file exists."
    paths: [CODEOWNERS, .github/CODEOWNERS, docs/CODEOWNERS]
  - id: OPS08-BP01
    pillar: operational-excellence
    proxy: true
    fact: "Alerting is linted in CI: a pint config exists."
    paths: [.pint.hcl]
  - id: SEC01-BP01
    pillar: security
    proxy: true
    fact: "CI workflows exist, so security checks can run in them."
    paths: [.github/workflows]
  - id: REL01-BP01
    pillar: reliability
    proxy: true
    fact: "SLO definitions exist in an slo directory."
    paths: [slo]
  - id: REL13-BP01
    pillar: reliability
    proxy: true
    fact: "An error-budget policy document exists."
    paths: [docs/error-budget-policy.md]
  - id: PERF01-BP01
    pillar: performance-efficiency
    proxy: true
    fact: "CI workflows exist, so a performance check can run in them."
    paths: [.github/workflows]
  - id: COST01-BP01
    pillar: cost-optimization
    proxy: true
    fact: "Infrastructure as code exists, where cost tags can be required."
    paths: [infra]
  - id: SUS01-BP01
    pillar: sustainability
    proxy: true
    fact: "Infrastructure as code exists, where scale-to-zero can be set."
    paths: [infra]
