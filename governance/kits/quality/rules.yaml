kit: quality
version: 1.0.0
rules:
  - id: FG-QA-001
    title: One separate-context review per PR with the conformance lens
    statement: Every PR MUST get exactly one review round in a separate context, and that review MUST apply the conformance lens, which reads the ticket's cited requirement ids and checks the diff against them.
    category: quality
    level: 1
    floor: true
    status: active
    applies_to: {paths: ["**"], blueprints: ["*"]}
    check: {kind: review-lens, ref: agents/pr-reviewer.md}
    exception: {allowed: false}
    note: The conformance lens is added to agents/pr-reviewer.md by gv-16.
    sources: ["Google engineering practices, code review standard (2026-11-04)", "Foundry governance design 2026-11-04, section 2.6"]
  - id: FG-QA-002
    title: Style is delegated to linters and formatters
    statement: Style rules MUST be enforced by a linter or formatter that runs in CI. Prose style guides MUST NOT be the enforcement path, and a reviewer SHOULD NOT spend review time on style a tool can settle.
    category: quality
    level: 1
    floor: false
    status: active
    applies_to: {paths: ["**"], blueprints: ["*"]}
    check: {kind: lint, ref: governance/kits/quality/checks/review-checklist.md}
    exception: {allowed: true, requires: [reason, owner, expires]}
    sources: ["Google engineering practices, code review standard (2026-11-04)", "Foundry governance design 2026-11-04, section 2.6"]
  - id: FG-QA-003
    title: Test strategy per blueprint with a coverage floor number
    statement: Each blueprint MUST document its test strategy (the test pyramid shape) and MUST state a coverage floor as a number. CI MUST fail when measured coverage falls below that number.
    category: quality
    level: 1
    floor: false
    status: active
    applies_to: {paths: ["**"], blueprints: ["*"]}
    check: {kind: ci, ref: governance/kits/quality/checks/coverage-ci.yml}
    exception: {allowed: true, requires: [reason, owner, expires]}
    sources: ["Google Testing Blog, test sizes and the test pyramid (2026-11-04)", "Foundry governance design 2026-11-04, section 2.6"]
  - id: FG-QA-004
    title: Flaky tests are quarantined with a record, never skipped
    statement: A flaky test MUST be quarantined with a record that names an owner, an issue, an entry date and an expiry date. Quarantine MUST NOT mean skip. The test still runs and its result is reported. An expired entry MUST be reported and MUST be fixed or removed.
    category: quality
    level: 1
    floor: false
    status: active
    applies_to: {paths: ["**"], blueprints: ["*"]}
    check: {kind: lint, ref: governance/kits/quality/checks/quarantine_check.py}
    exception: {allowed: true, requires: [reason, owner, expires]}
    sources: ["GitLab handbook, quarantined tests (2026-11-04)", "Datadog Test Optimization, flaky test management (2026-11-04)", "Foundry governance design 2026-11-04, section 2.6"]
  - id: FG-QA-005
    title: Retry budget is one and first-attempt failures are reported
    statement: A failing test MAY be retried at most once. A test that passes only on retry MUST be reported as a first-attempt failure, separately from the final result, and MUST NOT be counted as a clean pass.
    category: quality
    level: 1
    floor: false
    status: active
    applies_to: {paths: ["**"], blueprints: ["*"]}
    check: {kind: declared, ref: governance/kits/quality/checks/coverage-ci.yml}
    exception: {allowed: true, requires: [reason, owner, expires]}
    note: Declared. The CI job re-runs a failed test once and the report lists first-attempt failures apart from the final result (see the junit rerun snippet in checks/coverage-ci.yml).
    sources: ["GitLab handbook, quarantined tests (2026-11-04)", "Datadog Test Optimization, flaky test management (2026-11-04)"]
  - id: FG-QA-006
    title: Done means the Done-means command passes again on merged main
    statement: A fix is done only when it is re-measured. After a merge, the check the fix targets (the ticket's Done-means command) MUST be re-run on the merged main, and the ticket MUST NOT be marked done until that re-run passes. All of a tick's re-checks MUST be batched into one record PR. Items recorded as fixed MUST be re-audited before any formal run.
    category: quality
    level: 1
    floor: true
    status: active
    applies_to: {paths: ["**"], blueprints: ["*"]}
    check: {kind: ci, ref: scripts/foundry-ticket.py}
    exception: {allowed: false}
    note: Binds the done verb of scripts/foundry-ticket.py and the deck's verify-after-merge step in skills/command-deck (shipped by gv-13). Operating model rule A6.
    sources: ["Foundry governance design 2026-11-04, section 2.6", "Foundry operating model rule A6 (2026-11-04)"]
