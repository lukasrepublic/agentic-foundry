# Maps OpenSSF Scorecard checks to rules (retrieved 2026-11-04).
# Enforces: FG-SEC-012, FG-SEC-013, FG-SEC-014, FG-SEC-015, FG-SEC-016, FG-SEC-017, FG-SEC-018, FG-SEC-019, FG-SEC-020, FG-SEC-021
# gate: true  = ci-scorecard.yml.tmpl fails the run when that check scores below `threshold` (a score of -1 is skipped).
# gate: false = reported only. Rows are gated only where the rule says MUST and the check works for a single-author repository.
threshold: 7
mapping:
  - {check: Pinned-Dependencies, rule: FG-SEC-012, risk: Medium, gate: true}
  - {check: Signed-Releases, rule: FG-SEC-013, risk: High, gate: false}
  - {check: SBOM, rule: FG-SEC-014, risk: Medium, gate: false}
  - {check: Vulnerabilities, rule: FG-SEC-015, risk: High, gate: true}
  - {check: Dependency-Update-Tool, rule: FG-SEC-016, risk: High, gate: false}
  - {check: Branch-Protection, rule: FG-SEC-017, risk: High, gate: true}
  - {check: Code-Review, rule: FG-SEC-018, risk: High, gate: false}
  - {check: Token-Permissions, rule: FG-SEC-019, risk: High, gate: true}
  - {check: Dangerous-Workflow, rule: FG-SEC-020, risk: Critical, gate: true}
  - {check: Security-Policy, rule: FG-SEC-021, risk: Medium, gate: true}
