# claude-plugin — A Claude Code plugin: stdlib-first python scripts + a node CLI + hooks + skills (no pyproject/src layout). The foundry governs itself with this blueprint.
# Blueprint kit (gv-08): a stack profile extended with `governance` (kit selection),
# `detect` (weighted signals, evaluated by foundry_blueprint.rank), `surfaces`, a readiness checklist
# and a test strategy. Pins: standing-versions/ (research timestamp 2026-11-04, vendor sources named there).
profile_kind: app
id: claude-plugin
version: 0.1.0
requires_core: ">=0.1"

governance:
  kits:
    product: {level: 2}
    architecture: {level: 2}
    stack: {level: 2}
    security: {level: 3}
    contracts: {level: 2}
    quality: {level: 2}
    delivery: {level: 2}
    operations: {level: 1}
    observability: {level: 1}
    exceptions: {level: 2}
    conduct: {level: 2}
  design_required_paths:
    - "skills/**"
    - "hooks/**"
    - ".claude-plugin/**"
    - "agents/**"
    - "schema/**"

surfaces:
  - cli
  - workflows
  - goal-agents

detect:
  confidence_threshold: 0.6
  signals:
    - {kind: manifest, pattern: ".claude-plugin/plugin.json", weight: 5}
    - {kind: manifest, pattern: "hooks/hooks.json", weight: 2}
    - {kind: path, pattern: "skills/*/SKILL.md", weight: 3}
    - {kind: manifest, pattern: ".claude-plugin/marketplace.json", weight: 1}
    - {kind: path, pattern: "agents/*.md", weight: 1}
    - {kind: path, pattern: "commands/*.md", weight: 1}

readiness_checklist: blueprints/readiness-checklist.md
test_strategy: blueprints/test-strategy.md


architecture:
  layers:
    - scripts
    - hooks
    - skills
  allowed_dependencies:
    - from: skills
      to: ["scripts", "hooks"]
    - from: hooks
      to: ["scripts"]
    - from: scripts
      to: []
  conventions_doc: conventions.md

implementation_skills:
  - skills/implement-claude-plugin.md

static_validation:
  format: "git diff --check"
  lint: "python3 scripts/foundry-doctor.py"
  typecheck: "python3 -m compileall -q scripts hooks"
  build: "claude plugin validate ."

test_recipe:
  unit: "python3 -m pytest tests/ -q"
  integration: "python3 scripts/foundry-doctor.py"
  e2e: "node --test cli/test/"
  coverage_gate: 0

performance_checklist: >-
  Keep startup and import cost low; avoid accidental quadratic work on the hot path of this stack;
  measure before optimising and record the budget in the readiness checklist.

observability: >-
  Structured, leveled logging with correlation ids; metrics for rate, errors and duration of the
  primary unit of work; a health signal the boot recipe exercises.

documentation: >-
  README with local setup and the boot command; an ADR for the layering and dependency-direction
  choices; the readiness checklist and test strategy in blueprints/ kept current.

app_exercise_binding:
  boot: "python3 scripts/foundry-doctor.py"
  surfaces:
    - kind: cli
      exercise: "python3 scripts/foundry-doctor.py — the plugin's own doctor reports DOCTOR-GREEN"

standing-versions:
  manifest:
    path: standing-versions/manifest.yaml
  compatibility:
    path: standing-versions/compatibility.yaml
