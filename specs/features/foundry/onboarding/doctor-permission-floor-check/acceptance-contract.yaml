  - {ac_id: AC-DPF-6, surface: "file:docs/QUICKSTART.md", locator: "sh -c 'python3 -m pytest tests/test_doc_claims.py -q -k test_doctor_probe_claims && echo DPF-6-CLAIMS-OK'", expect: {op: matches, value: "DPF-6-CLAIMS-OK", baseline: none}}

  # --- AC-DPF-6 — troubleshooting section carries the literals `permission-floor`, `advisory`,
  #     `.claude/settings.local.json` and the remedy
  - {ac_id: AC-DPF-6, surface: "file:docs/troubleshooting.md", locator: "sh -c 'python3 -m pytest tests/test_permission_floor_check.py -q -k troubleshooting_documents_the_advisory_tier && echo DPF-6-DOC-OK'", expect: {op: matches, value: "DPF-6-DOC-OK", baseline: pre-change}}

  # --- AC-DPF-6 — CHANGELOG entry names the probe. The literal is `permission-floor probe`, NOT the bare
  #     `permission-floor`, which the map atom's own entry already carries via docs/permission-floor.json
  #     (a bare grep would be GREEN on the merge base and the pre-change baseline would be vacuous)
  - {ac_id: AC-DPF-6, surface: "file:CHANGELOG.md", locator: "sh -c 'grep -q \"permission-floor probe\" CHANGELOG.md && echo DPF-6-CHANGELOG-OK'", expect: {op: matches, value: "DPF-6-CHANGELOG-OK", baseline: pre-change}}

  # --- AC-DPF-7 — the map records the new library module as `not_invoked` (exactly one row added)
  - {ac_id: AC-DPF-7, surface: "file:docs/permission-floor.json", locator: "sh -c 'python3 -m pytest tests/test_permission_floor_check.py -q -k the_map_records_the_new_module_as_not_invoked && echo DPF-7-NOTINVOKED-OK'", expect: {op: matches, value: "DPF-7-NOTINVOKED-OK", baseline: pre-change}}

  # --- AC-DPF-7 THE SNAPSHOT — `entries` is byte-identical to the merge base: SHA-256 over
  #     json.dumps(entries, sort_keys=True, separators=(",",":"), ensure_ascii=False) equals the digest literal
  #     declared in the test module. Independent of the not_invoked addition; catches add/remove/re-tier/reorder.
  - {ac_id: AC-DPF-7, surface: "file:docs/permission-floor.json", locator: "sh -c 'python3 -m pytest tests/test_permission_floor_check.py -q -k the_map_entries_array_is_unchanged && echo DPF-7-ENTRIES-OK'", expect: {op: matches, value: "DPF-7-ENTRIES-OK", baseline: pre-change}}

  # --- AC-DPF-7 — the authorized sibling's own suite stays green (AC-PFM-2's closed world, reverse-direction
