  #     world, and its RED->GREEN partner is DPF-7-NOTINVOKED-OK above.)
  - {ac_id: AC-DPF-7, surface: "test:tests/test_permission_floor_map.py", locator: "sh -c 'python3 -m pytest tests/test_permission_floor_map.py -q && echo DPF-7-MAP-OK'", expect: {op: matches, value: "DPF-7-MAP-OK", baseline: none}}
