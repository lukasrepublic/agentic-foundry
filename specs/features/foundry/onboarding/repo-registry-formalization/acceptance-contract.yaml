  #     a degraded run alike; `degraded` is true with a non-empty reason exactly on the degraded run
  - {ac_id: AC-RRF-6, surface: "file:scripts/foundry_repo_registry.py", locator: "sh -c 'python3 -m pytest tests/test_repo_registry.py -q -k report_json_is_an_envelope_not_bare_rows && echo RRF-6-ENVELOPE-OK'", expect: {op: matches, value: "RRF-6-ENVELOPE-OK", baseline: pre-change}}

  # --- AC-RRF-6(v) — NO SILENT CLEAN EXIT: `repos` absent, `repos` empty, and `repos` non-object
  #     each yield the named `no-repos` outcome in BOTH channels with rows: [] and exit 2 — never
