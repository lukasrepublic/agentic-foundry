  #     preceded by `--`; a fixture entry whose path is `--upload-pack=…` is passed as a pathspec
  - {ac_id: AC-RRF-6, surface: "file:scripts/foundry_repo_registry.py", locator: "sh -c 'python3 -m pytest tests/test_repo_registry.py -q -k report_git_argv_is_read_only_and_dash_dash_guarded && echo RRF-6-ARGV-OK'", expect: {op: matches, value: "RRF-6-ARGV-OK", baseline: pre-change}}

  # --- AC-RRF-6 — DEGRADED ORACLE: no git on PATH / not a work tree yields `unknown`, which is
  #     NOT a finding (no false RED for a legitimately un-git'd root) and is stated in the output
  - {ac_id: AC-RRF-6, surface: "file:scripts/foundry_repo_registry.py", locator: "sh -c 'python3 -m pytest tests/test_repo_registry.py -q -k report_degrades_to_unknown_without_git && echo RRF-6-DEGRADE-OK'", expect: {op: matches, value: "RRF-6-DEGRADE-OK", baseline: pre-change}}

  # --- AC-RRF-6 — the shipped doctor is unchanged and this repo stays green (the atom adds a
