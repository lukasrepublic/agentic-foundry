  - {ac_id: AC-RRF-6, surface: "file:scripts/foundry_repo_registry.py", locator: "sh -c 'python3 -m pytest tests/test_repo_registry.py -q -k report_no_repos_is_a_named_outcome_never_silent_zero && echo RRF-6-NOREPOS-OK'", expect: {op: matches, value: "RRF-6-NOREPOS-OK", baseline: pre-change}}

  # --- AC-RRF-6(vi) — GIT INVOCATION HYGIENE, asserted on captured ARGV (not on output prose):
