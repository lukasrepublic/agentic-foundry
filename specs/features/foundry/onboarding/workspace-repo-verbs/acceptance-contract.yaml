  #     ROSTER (the two fleet-shaped verbs must not be confusable)
  - {ac_id: AC-WRV-9, surface: "file:skills/repos/SKILL.md", locator: "sh -c 'python3 -m pytest tests/test_repo_fleet.py -q -k skill_ships_and_disambiguates_from_the_session_roster && echo WRV-9-SKILL-OK'", expect: {op: matches, value: "WRV-9-SKILL-OK", baseline: pre-change}}

  # --- AC-WRV-9 — the shipped VERBS-QUICK-REF bijection (every skills/<verb>/ documented, no phantom
  #     verb documented) holds with /foundry:repos added. The suite is DENIED scope and runs unmodified.
  - {ac_id: AC-WRV-9, surface: "file:docs/VERBS-QUICK-REF.md", locator: "sh -c 'python3 -m pytest tests/test_docs_claims.py -q -k verb_reference && echo WRV-9-VERBREF-OK'", expect: {op: matches, value: "WRV-9-VERBREF-OK", baseline: none}}

  # --- AC-WRV-9 — the derived doc-claim locks hold: README.md's `other ~N skills` claim re-derives
  #     against skills/*/SKILL.md with the new directory present, and the how-to's section + closed
  #     `enforced` roster locks survive the appended verbs section. Both suites DENIED and unmodified.
  - {ac_id: AC-WRV-9, surface: "file:README.md", locator: "sh -c 'python3 -m pytest tests/test_doc_claims.py tests/test_docs_claims.py -q && echo WRV-9-DOCLOCKS-OK'", expect: {op: matches, value: "WRV-9-DOCLOCKS-OK", baseline: none}}

  # --- AC-WRV-9 — the how-to carries a verbs section naming sync/status/foreach/validate and stating
  #     the surfaced-never-fixed rule, and introduces NO new label into the document's `enforced`
  #     claim roster (which feat-foundry-control-plane-docs pins closed)
  - {ac_id: AC-WRV-9, surface: "file:docs/how-to/multi-repo-control-plane.md", locator: "sh -c 'python3 -m pytest tests/test_repo_fleet.py -q -k how_to_documents_the_verbs_without_new_enforced_labels && echo WRV-9-HOWTO-OK'", expect: {op: matches, value: "WRV-9-HOWTO-OK", baseline: pre-change}}

  # --- AC-WRV-9 — the release note names the new verb IN THE TOPMOST RELEASE SECTION (the plugin is
  #     version-keyed: an adopter receives only what the current section carries). awk emits only the
  #     text from the first `## v` heading up to the next one, so a mention anywhere else in the file
