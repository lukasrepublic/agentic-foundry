# tests/fixtures/reference-sweep/retired-framework-sweep.yaml — the FROZEN sweep definition for
# feat-foundry-ctx-zero-reference-gate (AC-CXG-1..9, CTX-REMOVAL program, P7).
#
# Mirrored VERBATIM from the sibling acceptance-contract.yaml preamble, and transcribed a SECOND
# time by hand inside tests/test_reference_sweep.py (the AC-CXG-1 drift cross-check). A set edit
# updates BOTH copies together.
#
# RE-MEASURED against the post-integration tree (base commit 2cc3f60, all four sibling CTX-REMOVAL
# code/prose atoms landed) rather than copied from the contract's pre-change baseline, which the
# contract's own preamble states was measured BEFORE those atoms existed and is stale by
# construction (43 new occurrences surfaced: 3 in scripts/foundry-fleet-session-machinery.py, 1 in
# the append-only packs/stack-profiles/profile-version-ledger.json, and 39 across five sibling
# atoms' own already-authorized test files whose identifiers necessarily name what they prove
# absent). See the atom's own report for the full re-measurement.
#
# token_set — FOUR ERE patterns, case-insensitive, evaluated over whitespace-normalized full text.
#   `ctx` is the catch-all: a bare substring, deliberately NOT word-boundaried, so the gate has no
#   false negatives at the file level (`probe_ctx`, `_ctx_probe_present`, `ctx_state`, `CtxState`,
#   `ctxinfra`, `block_ctx`, `ctx1` all match — everything `grep -i ctx` finds, this finds).
#   `ctx[ _-]?posture` / `ctx[ _-]?status` / `ctxinfra` give those spellings a distinct occurrence
#   key, keyed with precedence over the catch-all.
#
# occurrence key — (path, key_text). key_text is the case-folded matched text of the MOST SPECIFIC
#   token matching at that position (the three named spellings win over the bare catch-all), and
#   for a catch-all match key_text is WIDENED to the maximal run of [A-Za-z0-9_] characters
#   containing it — this is what lets the gate tell `block_ctx` (an unrelated helper) from
#   `probe_ctx` (a literal call into the retired module), which a word boundary cannot.
#
# surface — every git-tracked, UTF-8-decodable file under the swept root, minus self_exclusions.
#   `git ls-files`; if enumeration fails, the sweep reports RED rather than a partial surface.
token_set:
  - "ctx[ _-]?posture"
  - "ctx[ _-]?status"
  - "ctxinfra"
  - "ctx"

