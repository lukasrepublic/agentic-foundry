# tests/fixtures/release/cut-release-reconcile-sweep.yaml
# Mirrors VERBATIM the "FROZEN SWEEP DEFINITION" preamble of the sibling
# specs/features/foundry/release/cut-release-reconcile/acceptance-contract.yaml
# (AC-CRRC-1..8). This is the SINGLE fixture tests/test_cut_release_reconcile.py reads — the
# sweep's token set, surface set, allowlist, disclosure matrix, hook-comment expectation,
# preflight expectation and operator-registry shape are hash-frozen with the contract.
#
# This sweep's SUBJECT is claim tokens (retired-wiring-machinery prose), deliberately disjoint
# from tests/fixtures/subtraction/deleted-module-sweep.yaml's subject (deleted MODULE
# identifiers) — see the spec's Clarifications. The two fixtures are never merged.

# surface_set — the SEVEN enumerated shipped surfaces (explicit paths, not globs).
surface_set:
  - 'scripts/foundry-cut-release.py'
  - 'scripts/foundry-release-acceptance.py'
  - 'scripts/foundry-bootstrap.sh'
  - 'skills/cut-release/SKILL.md'
  - 'skills/init/SKILL.md'
  - 'hooks/foundry-git-discipline.sh'

# token_set — ERE alternation, one pattern per list item. The retired-wiring claim family plus
# the two owed-follow-up markers. Deliberately disjoint in purpose from the deleted-module sweep's
# module-identifier tokens.
token_set:
  - 'WIRING_FILES'
  - 'PINHEAL'
  - 'write[- ]pin'
  - 'write[- ]manifest'
  - 'wiring[- ]manifest'
  - 'wiring[_-]hash\.pin'
  - 'wiring[- ]pin'
  - 'wiring[- ]hash'
  - 'branch-protection'
  - 'needs (its own|a dedicated) follow-up'
  - 'flagged honestly'

# zero_occurrence_surfaces — the FOUR of the seven surfaces expected to carry ZERO occurrences of
# any frozen token (the strong claim); any hit the build finds there must be fixed, never
# allowlisted.
zero_occurrence_surfaces:
  - 'scripts/foundry-cut-release.py'
  - 'scripts/foundry-release-acceptance.py'
  - 'scripts/foundry-bootstrap.sh'
  - 'hooks/foundry-git-discipline.sh'

# allowlist — every occurrence the sweep finds over (surface_set x token_set) is covered by
# exactly one entry below: `path` (must resolve in the candidate tree), `token` (must be a
# member of token_set, verbatim), `reason` (non-empty, states the occurrence is a retired
# disclosure or live-and-accurate prose, never an instruction to perform a retired step).
# Grounded against the real (post-reconcile) tree, 2026-07-28: every entry below was verified by
# actually running the sweep over the shipped tree.
allowlist:
  - path: skills/cut-release/SKILL.md
    token: 'wiring[- ]pin'
    reason: >-
      The single consolidated "Retired" disclosure names the retired wiring-pin migrate
      step; a retirement disclosure, not an instruction to perform it.
  - path: skills/cut-release/SKILL.md
    token: 'wiring[- ]hash'
    reason: >-
      Same consolidated disclosure, naming foundry-wiring-hash.py and the doctor's retired
      wiring-hash check; a retirement disclosure.
  - path: skills/cut-release/SKILL.md
    token: 'wiring[_-]hash\.pin'
    reason: >-
      Same consolidated disclosure, naming the retired .foundry/wiring-hash.pin file; a
      retirement disclosure.
  - path: skills/init/SKILL.md
    token: 'wiring[- ]pin'
    reason: >-
      Step 8's settled one-liner records that there is nothing left to pin, in the same sentence
      that names foundry-wiring-hash.py's retirement; a retirement disclosure.
  - path: skills/init/SKILL.md
    token: 'wiring[- ]hash'
    reason: >-
      Step 8's settled one-liner names foundry-wiring-hash.py and the doctor's retired
      wiring-hash check; a retirement disclosure.
  - path: skills/init/SKILL.md
    token: 'branch-protection'
    reason: >-
      Step 5's own section is titled "Branch protection — the as-CODE applier is retired; use the
      tier preflight" and describes what actually replaced it. The earlier wording of this entry
      said the step "accurately describes today's Tier B advisory floor", which stopped being
      true once protection was applied to main; corrected here rather than left to rot, per the
      maintenance note below. Live-and-accurate prose, not stale.

# disclosure_matrix (AC-CRRC-3) — one row per prose surface, each naming the three required
# elements a conformant retired disclosure must carry, authored independently of the prose it
# checks.
disclosure_matrix:
  - path: skills/cut-release/SKILL.md
    mechanism: 'foundry-wiring-hash.py'
    release: 'Retired'
    load_bearer: 'foundry-release-acceptance'
  - path: skills/init/SKILL.md
    mechanism: 'foundry-wiring-hash.py'
    release: 'Retired'
    load_bearer: 'DOCTOR-GREEN'

# forbidden_deferral_tokens — applied to ALL SIX surfaces; no surface may defer to a follow-up.
forbidden_deferral_tokens:
  - 'needs (its own|a dedicated) follow-up'
  - 'flagged honestly'

# hook_comment_expectation (AC-CRRC-8) — the git-discipline hook's CONFIG SOURCE comment.
hook_comment_expectation:
  forbidden_claim_fragments:
    - 'wiring-hash-covered'
    - 'edited only at the out-of-session wiring layer'
  required_coverage_fragments:
    - 'hooks.json'
    # MAINTENANCE NOTE (security review, PR #281): the fragments below are
    # absence-of-stale-claim expectations that hold ONLY while the mechanism stays
    # retired. If a real integrity check for hooks.json is ever built, the correct
    # response is to EDIT THIS FIXTURE to match the new truth — never to delete
    # accurate prose from the hook so a frozen token sweep keeps passing.
    - 'no mechanical integrity check'
    - 'security-path'
  # sha256 of the shipped hook's EXECUTABLE CONTENT (full-line comments stripped, shebang
  # retained). This row pins the hook against UNREVIEWED executable edits. Re-baselining is the
  # documented response to a real, reviewed change (see the note above: edit the fixture to match
  # the new truth) — it is NOT a relaxation: the row still fails on any later unreviewed edit.
  #
  # Re-baseline log — every entry is a deliberate executable change with its own spec + review:
  #   1. originally recorded for a COMMENT-ONLY atom (assert the body did not change)
  #   2. feat-foundry-merge-verify-context — clause (i) was querying the wrong PR (it dropped
  #      --repo, the cwd and the gh identity), admitting merges whose checks were red
  #   3. feat-foundry-verb-path-resolution — all three clause loops matched their verb by exact
  #      token equality, so any path-qualified invocation (/usr/bin/git, /bin/rm) bypassed the
  #      whole hook; routed through a shared _is_verb() matcher
  #   4. spec-review Block on merge-verify-context — pflag CLUSTERS short flags, so
  #      -sRowner/repo left the query unpinned; replaced spelling-enumeration with a
  #      structural parse of gh pr merge's closed flag set
  #   5. bash-3.2 parse compat + security-review hardening (2026-08-02, light lane, PR #49):
  #      the python heredoc moved out of $(...) into _git_discipline_eval() (bash 3.2's
  #      substitution scanner mis-tracks backquotes across heredoc content), and the
  #      internal-evaluator-error path stops echoing the raw command (inline-credential leak
  #      exactly when the redacting evaluator has failed). Evaluator content byte-identical.
  #   6. the public-zero atom (2026-09-01, lean lane, PR #135): a PURE IDENTIFIER RENAME of the
  #      block-with-context helper, across 1 definition and 10 call sites, removing the retired
  #      framework's name from a public repo. The block DECISION logic is byte-identical -- every
  #      call site kept its line number and its message; a gating security review verified all
  #      eleven sites and confirmed no guard path became unreachable. Re-based because exec_content()
  #      strips comments, so an identifier change necessarily moves the digest.
  #   7. feat-foundry-guards-guard-structured-observations (2026-09-19, factory lane,
  #      security-flagged): the hook now imports scripts/foundry_shell_scan.py and neutralizes a
  #      data-classified heredoc body before its EXISTING clause detection runs (every clause
  #      rule byte-identical; only what text feeds them changed), and block() gained a
  #      remediation/retryable/evidence-carrying JSON verdict (AC-GSO-4) replacing the old plain
  #      "BLOCK <reason>" line. Both are real, reviewed executable changes to this hook.
  #   8. guard-paren-tokens (2026-09-21, hotfix lane, security-reviewed): unquoted `(`, `)` and
  #      backticks are spaced into standalone PLAIN tokens before shlex (not SEPARATORS — the
  #      first cut made `(` bound a clause, which truncated `git push $(cat r) --force main` to
  #      an ADMIT; the independent security review caught it and the corpus pins it). Measured
  #      before the change, `(git push --force origin main)`, `git push --force origin main)`
  #      and `` `git push --force origin main` `` were ADMITTED (shlex kept `(git` / `main)` /
  #      `` `git `` as one word each) while the spaced forms blocked. Second review round:
  #      clause_args() FILTERS the parens (not the backtick) out of every git clause's argument run (a
  #      stray `)` had counted as a refspec of `(git push --force origin)` and disabled the
  #      no-refspec ⇒ protected rule — measured ADMIT), and a non-literal remote/refspec
  #      (`$BRANCH`, `$(…)`, a glob) is now assumed protected. The grouped-cd context check
  #      refuses a `cd` ANYWHERE inside an unclosed `(` or a backtick span; the merge-args parser
  #      skips the parens (NOT the backtick, which must keep tripping the selector literal check)
  #      and the env-prefix loop skips all three. Same class as the Claude Code 2.1.275 sandbox
  #      fix (one exempt component excusing a whole compound command). Regression corpus in
  #      tests/test_hooks_guards.py::test_discipline_convicts_compound_and_grouped_shapes.
  #   9. v118-b-hooks (2026-09-25, v1.18.0, audit A6/A7): two deliberate friction removals.
  #      (i) `gh pr merge --auto` (pflag-parsed; `--auto=false` is not auto) is admitted without
  #      the live `gh pr checks` query — the platform's required checks enforce the wait; the
  #      `--admin` refusal runs first and is unchanged (AC-V118B-2). (ii) a force-push naming NO
  #      refspec resolves its destination (current branch + its upstream merge ref, read in the
  #      payload cwd / a literal `-C`) and is refused only when protected; every construct that
  #      could change the branch before it runs, or push more than one branch, stays refused
  #      fail-closed (AC-V118B-3). Every other clause byte-identical. Corpus:
  #      tests/test_hooks_guards.py::test_v118b*.
  #  10. v1.18.0 security review R1 (2026-09-25): the no-refspec resolution in entry 9 is narrowed —
  #      every EARLIER clause must itself be a branch-preserving `git` command (`bash -c "git
  #      checkout main" && …`, `./x.sh; …`, `make …` and `git stash branch …` keep the push
  #      refused), and a remote configured as a mirror keeps it refused. Strictly narrower than 9.
  #      Corpus: tests/test_hooks_guards.py::test_v118_review_r1_*.
  #  11. v2.0.0 clause (j) local-green (ticket #269): every push of commits needs <git-dir>/foundry-local-green
  #      naming HEAD (written by scripts/foundry-test.sh); a non-draft `gh pr create` likewise. Admission-only,
  #      after clause (a); opt-out `--local-green=off`. Corpus: tests/test_ticket_first.py.
  #  12. gv-10 merge primitives (2026-11-04, security lane, PR #296, security-reviewed): clause (k) tightens the
  #      auto-merge admission (AC-V118B-2) to "the base names a required status check, by ruleset or classic branch
  #      protection, AND the live checks are green at the head", fail-closed; clause (l) refuses a `git push` whose
  #      destination branch has a PR in the merge queue (GraphQL read), resolving the push remote with
  #      `get-url --push`, skipping value-taking push flags, and refusing an unresolvable non-local host
  #      (`remote-host-unresolvable`). Every other clause byte-identical. Corpus:
  #      tests/test_git_discipline_queue.py, tests/test_hooks_guards.py::test_v118b2_*.
  #  13. gv-10 round 2 (2026-11-04, security lane, PR #296): refusal text no longer carries URL userinfo
  #      (`https://user:<token>@host` is stripped centrally in _redact), and clause (l) passes the push command's
  #      inline `-c k=v` into the `get-url --push` probe, refusing a `-c url.*`/`remote.*` rewrite whose result is
  #      neither local nor a host gh knows. Corpus: tests/test_git_discipline_queue.py (round 2 section).
  #  14. gv-11 clause (m) claim-required (2026-11-04, security lane, PR #300): a push of commits / a non-draft
  #      `gh pr create` needs a LIVE claim for the issue the active ticket is bound to
  #      (scripts/foundry_ticket_store.py claim_gate; honours `git -C`, fail-closed on an unreadable claims store
  #      or project file, inert where claims are not in use). Every other clause byte-identical. Corpus:
  #      tests/test_claims_expiry.py.
  #  15. gv-20 hardening (2026-11-05, security lane): clause (m) also gates `gh pr new`, `gh pr ready` (a draft becoming a
  #      non-draft PR; `--undo` is exempt) and a REST `gh api repos/<o>/<r>/pulls` create (explicit or field-implied POST,
  #      `-F draft=true` exempt), via a new _gh_api_pr_post helper. Every other clause byte-identical. Corpus:
  #      tests/test_hardening_gv20.py (item 5).
  executable_content_sha256: '346141c13131b9de292190dfd7d58e5145a0cbdf33ebf5f51f106d82dfce0a82'  # re-baselined for entry 15 (gv-20)

# gv-20 hook pins: sha256 of the EXECUTABLE CONTENT (full-line comments stripped, shebang kept; same function as the
# git-discipline row above) of every other hook the hardening pass changed. Re-baselining is the documented response to a
# real, reviewed change, with a log line here: this row still fails on any later unreviewed edit.
#   1. gv-20 (2026-11-05, security lane): paper guard (cd tracking, -t, recursive copies, rm -rf trees, worktree/nested CI),
#      shell-shape (redirect forms, ANSI/locale quoting, packed interpreters, delete verbs, own-session scratch), secret-read
#      guard (option-tolerant verbs, dd if=, whole-home reads, tar -C, /proc/*/environ), plugin-scripts-allow (env remote ask).
#   2. gv-20 round 2 (2026-11-05): paper guard keeps a successful `cd` across `;`, newline, `||`, `&&` (ends at a pipe, a lone `&`, `)`);
#      shell-shape: python `-V` only as a version flag, per-interpreter option values, `deno eval`; secret-read guard: tar operands
#      judged against the cwd and every -C.
#   3. gv-20 round 3 (2026-11-05): shell-shape refuses a bare `-` script operand and `--eval=`/`--print=` forms and applies the
#      value-aware operand parse to python; paper guard restores the pre-pipeline base at `|`/`&` and treats `cd -`/`popd`/`cd $VAR`
#      as unknown (previous base kept); secret-read guard reads a bundled `-zC<dir>` value.
#   4. dl-04 (2026-11-05): plugin-scripts-allow adds foundry_execution_plan.py to _ASK_SCRIPTS (the whole script asks).
#   5. dl-14 (2026-11-05): plugin-scripts-allow asks on `deck-cost-census.py --append`, `--repo` and `--prs` (the floor row is ask).
gv20_hook_pins:
  foundry-paper-guard.py: 'e8d53c711e40e9869f3b2076c04e8474f7e4dff240b1e5b0f653596961aae88d'
  foundry-shell-shape.py: 'de6722ba044b0029040a28b075227317bb0cd988da803c794de426ad414acc60'
  foundry-secret-read-guard.py: 'dbaac7eb5fe017c3088afdc6ca138886ad68211dd369dfe16a113472715a48be'
  foundry-plugin-scripts-allow.py: '29acffbdafd4330532ab77d1ec96a13ef03e84963d6e192c4bcdbc6c0c40a1a9'

# operator_registry_shape (AC-CRRC-5) — the seeded .claude/foundry-operators.json shape.
operator_registry_shape:
  schema_version_type: int
  operators_type: mapping

# preflight_expectation (AC-CRRC-6) — the four check names the shipped preflight() returns, and
# the forbidden-claim tokens its docstrings must not carry.
preflight_expectation:
  expected_preconditions:
    - 'plugin.json version == target'
    - 'marketplace.json version == target (bump BOTH manifests)'
    - 'marketplace source.ref == vTARGET'
    - 'CHANGELOG.md has the ## vTARGET section'
    # AC-TPC-9 — the re-pin commit (R2) is created AFTER the acceptance verdict and the tag lands
    # on it, so anything left uncommitted would ship under the release tag ungated
    - 'working tree is clean (R2 is created after the gate runs)'
    # AC-TPC-2 — what an adopter installing by ref actually resolves
    - 'install pin at vTARGET resolves this release'
  forbidden_claim_tokens:
    - 'wiring-pin'
    - 'merge-gate'
    - 'wiring-hash'

# deadness_evidence (AC-CRRC-4) — asserted directly.
deadness_evidence:
  tree_pin_path: '.foundry/wiring-hash.pin'
  doctor_script: 'scripts/foundry-doctor.py'

# sibling_sweep_source (AC-CRRC-7) — WHERE the non-regression expectation is read from (never
# restated here). The three enumerated skill surfaces whose entries must stay non-vacuous are
# looked up in that file's `allowlist`.
sibling_sweep_fixture: 'tests/fixtures/subtraction/deleted-module-sweep.yaml'
sibling_sweep_lookup_paths:
  - 'skills/cut-release/SKILL.md'
  - 'skills/init/SKILL.md'
