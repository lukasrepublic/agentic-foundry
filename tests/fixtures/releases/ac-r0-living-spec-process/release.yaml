# Reported to the operator as pre-existing defects in the real manifest, independent of this
# atom's vocabulary work (see the atom's final report / PR body).
#
# SEPARATELY (also reported, NOT fixed here — outside this atom's authority to widen): every
# atom below carries NONE of `spec_ref`/`contract_ref`/`charter_ref` (R0 predates the
# charter_ref convention; it was driven by hand per its own `state.yaml`). Per AC-RLV-2 as
# frozen, an atom carrying neither shape is refused BY NAME — so `fr.load_release` on this
# fixture correctly RAISES ReleaseError, naming the first atom, exactly as AC-RLV-2 specifies.
# That is a genuine gap against AC-RLV-5's literal text ("SHALL load without error"); see
# tests/test_release.py's TestReleaseLoaderVocabulary.test_r0_fixture_top_level_vocabulary_ok
