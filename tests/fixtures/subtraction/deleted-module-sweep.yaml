# tests/fixtures/subtraction/deleted-module-sweep.yaml
# Mirrors VERBATIM the "FROZEN SWEEP DEFINITION" preamble of the sibling
# specs/features/foundry/governance/subtraction-contract-widening/acceptance-contract.yaml
# (AC-SCW-6/-7/-9). This is the SINGLE fixture tests/test_subtraction_absence.py reads — the
# widened locators are hash-frozen with the contract and the normative region stays stable
# under a set edit.
#
# token_set — ERE alternation, one pattern per list item (both spellings of every deleted
# module PLUS the retired hook, workflow, skill and config names). `foundry-branch-protection`
# (Block 2) and the hyphen forms `foundry-emit-provenance` / `foundry-authorize-light` /
# `foundry-merge-gate-status` are the widened members the shipped AC-SUB-2/AC-SUB-6 alternation
# could not match.
token_set:
  - 'foundry[_-]merge[_-]gate'
  - 'foundry[_-]ci[_-]gate'
  - 'foundry[_-]walk[_-]evidence'
  - 'foundry[_-]ui[_-]walk'
  - 'foundry[_-]provenance'
