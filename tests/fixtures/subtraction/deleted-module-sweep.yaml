# allowlist — AC-SCW-9's approved exceptions. Every occurrence the widened sweep would
# otherwise flag over (surface_set x token_set) is covered by exactly one entry below: `path`
# (must resolve in the candidate tree), `token` (must be a member of token_set, verbatim), and
# `reason` (non-empty, states the occurrence is comment/docstring/registry/skill-retirement-note
# prose, never an executed reference). Grounded against the real tree, 2026-07-28 (GP-2 build):
# every entry below was verified by actually running the widened sweep over the shipped tree —
# nothing here is aspirational.
allowlist:
  - path: scripts/foundry_contract.py
    token: 'foundry[_-]merge[_-]gate'
    reason: >-
      Comparative docstring naming the retired bespoke merge gate for contrast with the native
      floor; not an import or invocation.
  - path: scripts/foundry_contract.py
    token: 'foundry-emit-provenance'
    reason: >-
      Comparative docstring listing the retired provenance-chain scripts by name; not an import
      or invocation.
  - path: scripts/foundry_realization.py
