# surface_set — the whole executable AND prompt-executable surface. The shipped AC-SUB-6
# locator named only five files; skills/ + agents/ join this round (skill/agent prose is
# prompt-level executable surface, so a stale deleted-module mention there is an instruction to
# invoke it).
surface_set:
  - 'scripts/*.py'
  - 'scripts/*.sh'
  - 'scripts/foundry_checks/*.py'
  - 'hooks/*.sh'
  - 'hooks/hooks.json'
  - 'workflows/*.js'
  - '.github/workflows/*.yml'
  - 'skills/*/SKILL.md'
  - 'agents/*.md'

# absent_paths — the AC-SUB-1 set (32 paths, unchanged, not renumbered) PLUS
# scripts/foundry-branch-protection.sh (Block 2, AC-SCW-6). Every entry SHALL NOT exist in the
# candidate tree.
absent_paths:
  - scripts/foundry_merge_gate.py
  - scripts/foundry-merge-gate.py
  - scripts/foundry-ci-gate.py
  - hooks/foundry-merge-gate-hook.sh
  - hooks/foundry-pr-create-provenance.sh
