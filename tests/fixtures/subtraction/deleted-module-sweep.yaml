# `reason` (non-empty, states the occurrence is comment/docstring/registry/skill-retirement-note
# prose, never an executed reference). Grounded against the real tree, 2026-07-28 (GP-2 build):
# every entry below was verified by actually running the widened sweep over the shipped tree —
